# Opt-in ADR-005 Tracking writer. Current Web and Gateway stay on the tested legacy runtime.
services:
  tracking-api:
    build:
      context: .
      dockerfile: src/LongevityDiet.Tracking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8084
      ConnectionStrings__Tracking: Server=sqlserver,1433;Database=LongevityTrackingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Identity__BaseUrl: http://identity:8081
      Redis__ConnectionString: redis:6379
    ports:
      - "127.0.0.1:${TRACKING_API_PORT:-18084}:8084"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
    networks: [ldc-network]
