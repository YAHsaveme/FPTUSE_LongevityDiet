# Opt-in ADR-005 Recommendation owner. Existing recommendation-grpc remains the
# proven current-runtime endpoint; this owner is not Gateway-routed yet.
services:
  recommendation-owner:
    build:
      context: .
      dockerfile: src/LongevityDiet.Recommendation.Grpc/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Recommendation: Server=sqlserver,1433;Database=LongevityRecommendationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Redis__ConnectionString: redis:6379
      Identity__BaseUrl: http://identity:8081
      Kestrel__Endpoints__Grpc__Url: http://+:8085
      Kestrel__Endpoints__Grpc__Protocols: Http2
      Kestrel__Endpoints__Rest__Url: http://+:8087
      Kestrel__Endpoints__Rest__Protocols: Http1
    ports:
      - "127.0.0.1:${RECOMMENDATION_OWNER_GRPC_PORT:-18085}:8085"
      - "127.0.0.1:${RECOMMENDATION_OWNER_PORT:-18087}:8087"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
    networks: [ldc-network]
