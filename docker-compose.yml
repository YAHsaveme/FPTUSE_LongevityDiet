name: longevity-diet

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-14330}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [ldc-network]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ldc-network]

  recommendation-grpc:
    build:
      context: .
      dockerfile: src/LongevityDiet.Recommendation.Grpc/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      Kestrel__EndpointDefaults__Protocols: Http2
    ports:
      - "${GRPC_PORT:-8081}:8081"
    networks: [ldc-network]

  api:
    build:
      context: .
      dockerfile: src/LongevityDiet.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=sqlserver,1433;Database=LongevityDietDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Redis__ConnectionString: redis:6379
      Grpc__RecommendationUrl: http://recommendation-grpc:8081
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation-grpc:
        condition: service_started
    networks: [ldc-network]

  worker:
    build:
      context: .
      dockerfile: src/LongevityDiet.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver,1433;Database=LongevityDietDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Redis__ConnectionString: redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ldc-network]

  web:
    build:
      context: .
      dockerfile: src/LongevityDiet.Web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    networks: [ldc-network]

networks:
  ldc-network:

volumes:
  sql-data:
    name: longevity-diet-sqlserver-data
  redis-data:
    name: longevity-diet-redis-data
