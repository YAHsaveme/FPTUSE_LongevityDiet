# Optional ADR-005 Planning writer slice, not yet Gateway-routed.
# Default runtime continues to use tested legacy planner until safe cutover.
services:
  planning:
    build:
      context: .
      dockerfile: src/LongevityDiet.Planning/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083
      ConnectionStrings__Planning: Server=sqlserver,1433;Database=LongevityPlanningDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Redis__ConnectionString: redis:6379
    ports:
      - "127.0.0.1:${PLANNING_PORT:-18083}:8083"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ldc-network]
