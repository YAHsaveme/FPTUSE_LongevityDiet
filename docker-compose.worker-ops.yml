# Opt-in ADR-005 Worker operations API and Redis consumer. The legacy
# worker remains unchanged until an audited cutover.
services:
  worker-ops:
    build:
      context: .
      dockerfile: src/LongevityDiet.Worker.Ops/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8086
      ConnectionStrings__Worker: Server=sqlserver,1433;Database=LongevityWorkerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Redis__ConnectionString: redis:6379
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:${WORKER_OPS_PORT:-18086}:8086"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ldc-network]
