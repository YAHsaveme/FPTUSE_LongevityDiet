# Opt-in independent Catalog & Rules target slice.
# No Web/Gateway routes move to Catalog until full writer cutover.
# docker compose -f docker-compose.yml -f docker-compose.catalog.yml up -d --build catalog
services:
  catalog:
    build:
      context: .
      dockerfile: src/LongevityDiet.Catalog/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8082
      ConnectionStrings__Catalog: Server=sqlserver,1433;Database=LongevityCatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:${CATALOG_PORT:-18082}:8082"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [ldc-network]
