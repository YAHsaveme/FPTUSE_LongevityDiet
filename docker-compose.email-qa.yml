# Local-only SMTP capture. Compose this AFTER base + worker-ops + rabbitmq
# overlays. It never contacts real Gmail or recipient mail servers.
# Never enable on a public host; Mailpit is a test mailbox.
services:
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
    networks: [ldc-network]

  api:
    environment:
      EmailNotifications__Enabled: "true"
      EmailVerification__Enabled: "true"
      EmailVerification__HashKeyBase64: ${EMAIL_VERIFICATION_QA_HASH_KEY:?generate_32_random_bytes_for_isolated_email_QA}
      EmailNotifications__SmtpHost: mailpit
      EmailNotifications__SmtpPort: "1025"
      EmailNotifications__SmtpTls: "false"
      EmailNotifications__FromAddress: "no-reply@longevitydiet.test"
      EmailNotifications__PublicBaseUrl: "http://localhost:${WEB_PORT:-5173}"
      EmailNotifications__AllowedRecipientDomains: "example.test"
      EmailNotifications__AllowAnyRecipientDomain: "false"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UseTls: "false"
      RabbitMq__UserName: ${RABBITMQ_USER:-ldc-qa}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-qa-rabbit-only-not-production}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
