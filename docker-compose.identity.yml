# Opt-in ADR-005 Identity owner, NOT a default Gateway cutover:
# other domain services still read legacy users until migration completes.
services:
  identity:
    build:
      context: .
      dockerfile: src/LongevityDiet.Identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Identity: Server=sqlserver,1433;Database=LongevityIdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Redis__ConnectionString: redis:6379
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-18081}:8081"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ldc-network]
