# Optional read-only Tracking REST target process on its ALREADY isolated DB.
# Does not move legacy write/recalculation routes or let Tracking read MainDb.
services:
  tracking-api:
    build:
      context: .
      dockerfile: src/LongevityDiet.Tracking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8084
      ConnectionStrings__Tracking: Server=sqlserver,1433;Database=LongevityTrackingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:${TRACKING_API_PORT:-18084}:8084"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [ldc-network]
